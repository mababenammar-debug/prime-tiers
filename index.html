<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<meta name="referrer" content="no-referrer">
<title>PrimeTiers — Minecraft PvP Tier List</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
tailwind.config = { theme: { extend: {
  colors: { base:'#030305', card:'#09080e', acc:'#10b981', vio:'#8b5cf6' },
  fontFamily: { display:['Space Grotesk','sans-serif'], body:['Inter','sans-serif'] }
}}};
</script>
<style>
/* ============================================================
   PRIMETIERS — VOID BLACK / VIOLET BORDERS / EMERALD ACCENTS
============================================================ */
:root{ --acc:16,185,129; --vio:139,92,246; }

*{ box-sizing:border-box; }
body{
  background:
    radial-gradient(900px 520px at 12% -10%, rgba(139,92,246,.09), transparent 60%),
    radial-gradient(800px 460px at 88% -6%, rgba(16,185,129,.05), transparent 55%),
    radial-gradient(1000px 620px at 50% 118%, rgba(139,92,246,.05), transparent 60%),
    #030305;
  min-height:100vh; margin:0;
  color:#e2e8f0; font-family:'Inter',sans-serif;
}
::selection{ background:rgba(16,185,129,.3); }
::-webkit-scrollbar{ width:9px; height:8px; }
::-webkit-scrollbar-track{ background:#030305; }
::-webkit-scrollbar-thumb{ background:#1a1526; border-radius:8px; }
::-webkit-scrollbar-thumb:hover{ background:#2a2140; }
.pixel{ image-rendering:pixelated; image-rendering:crisp-edges; }
button{ font-family:inherit; cursor:pointer; }
input, select{ color:#e2e8f0; font-family:inherit; }
a{ color:inherit; }
.pts-badge{ display:inline-flex; align-items:center; justify-content:center; min-width:54px; height:24px; padding:0 10px;
  border-radius:8px; font-family:'Space Grotesk',sans-serif; font-weight:800; font-size:12px;
  color:#6ee7b7; background:rgba(16,185,129,.10); border:1px solid rgba(16,185,129,.45);
  box-shadow:0 0 12px rgba(16,185,129,.15); white-space:nowrap; }
.pts-title{ font-size:10px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:#a78bfa; }

@media (prefers-reduced-motion: reduce){ *,*::before,*::after{ transition:none !important; animation:none !important; } }

/* ============ CARDS / GLASS ============ */
.glass{
  background:rgba(9,8,14,.82);
  border:1px solid rgba(139,92,246,.2);
  border-radius:16px;
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04);
}
.wrap{ max-width:1180px; margin:0 auto; padding:0 14px 40px; }
.text-glow{ text-shadow:0 0 18px rgba(16,185,129,.45); }
.item-shadow{ filter:drop-shadow(0 2px 6px rgba(0,0,0,.65)); }
.row-lift{ transition:all .3s ease-in-out; }
.row-lift:hover{ border-color:rgba(16,185,129,.45); box-shadow:0 0 26px rgba(16,185,129,.10), 0 8px 24px rgba(0,0,0,.5); transform:scale(1.005); }
.hover-scale{ transition:all .3s ease-in-out; }
.hover-scale:hover{ transform:scale(1.06); } .hover-scale:active{ transform:scale(.95); }
.no-dec{ text-decoration:none; }

/* ============ NAV ============ */
.topnav{ position:sticky; top:12px; z-index:50; display:flex; justify-content:center; padding:0 12px; margin-bottom:20px; }
.nav-inner{ width:min(1120px,100%); display:flex; align-items:center; gap:14px; padding:10px 16px; }
.nav-links{ display:flex; gap:4px; margin-left:6px; }
.nav-link{ padding:8px 13px; border-radius:10px; color:#94a3b8; font-weight:600; font-size:13px; text-decoration:none; transition:all .25s ease-in-out; }
.nav-link:hover{ color:#f1f5f9; background:rgba(255,255,255,.04); transform:translateY(-1px); }
.nav-link.active{ color:rgb(var(--acc)); text-shadow:0 0 10px rgba(var(--acc),.5); }
.nav-right{ margin-left:auto; display:flex; gap:10px; align-items:center; }
.nav-search{ width:220px; height:38px; border-radius:10px; background:rgba(255,255,255,.04); border:1px solid rgba(139,92,246,.25); padding:0 12px; font-size:13px; transition:all .25s ease-in-out; }
.nav-search:focus{ outline:none; border-color:rgba(var(--acc),.6); box-shadow:0 0 0 3px rgba(var(--acc),.12); }
.burger{ display:none; width:38px; height:38px; border-radius:10px; background:rgba(255,255,255,.05); border:1px solid rgba(139,92,246,.25); color:#e2e8f0; font-size:16px; }
#mobile-links{ width:min(1120px,100%); margin:10px auto 0; padding:12px; display:flex; flex-direction:column; gap:8px; }
#mobile-links .nav-link{ display:block; }
.m-search{ width:100%; height:40px; border-radius:10px; background:rgba(255,255,255,.04); border:1px solid rgba(139,92,246,.25); padding:0 12px; font-size:13px; }

/* ============ BRAND LOGO ============ */
.brand-logo{ display:inline-flex; flex-direction:column; user-select:none; font-family:'Space Grotesk',sans-serif; line-height:1; text-decoration:none; }
.logo-row{ display:flex; align-items:baseline; font-size:20px; font-weight:800; letter-spacing:.02em; }
.logo-prime{ color:#ffffff; }
.logo-tiers{ color:#06b6d4; text-shadow:0 0 12px rgba(6,182,212,.55); }
.logo-underline{ height:2px; width:0; margin-top:5px; border-radius:2px;
  background:linear-gradient(90deg,#06b6d4,#a855f7);
  box-shadow:0 0 10px rgba(6,182,212,.7);
  transition:width .35s ease-in-out; }
.brand-logo:hover .logo-underline{ width:100%; }
.logo-xl .logo-row{ font-size:clamp(44px,9vw,84px); letter-spacing:-.02em; }
.logo-xl .logo-underline{ width:72px; }

/* ============ BUTTONS ============ */
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; height:42px; padding:0 18px; border-radius:12px; font-weight:700; font-size:13px; border:1px solid transparent; text-decoration:none; transition:all .25s ease-in-out; }
.btn:hover{ transform:translateY(-1px); } .btn:active{ transform:scale(.96); }
.btn-primary{ background:linear-gradient(135deg,#10b981,#059669); color:#02120b; box-shadow:0 0 18px rgba(16,185,129,.3), inset 0 1px 0 rgba(255,255,255,.25); }
.btn-primary:hover{ box-shadow:0 0 26px rgba(16,185,129,.45), inset 0 1px 0 rgba(255,255,255,.25); }
.btn-ghost{ background:rgba(255,255,255,.04); border-color:rgba(139,92,246,.3); color:#cbd5e1; }
.btn-ghost:hover{ border-color:rgba(16,185,129,.5); color:#f1f5f9; }
.btn-danger{ background:rgba(239,68,68,.12); border-color:rgba(244,63,94,.5); color:#fda4af; }
.btn-discord{ background:#5865F2; color:#fff; box-shadow:0 0 18px rgba(88,101,242,.35); }
.btn-discord:hover{ box-shadow:0 0 26px rgba(88,101,242,.55); }
.btn-discord svg{ width:18px; height:18px; flex-shrink:0; }
.dc-icon{ display:inline-flex; align-items:center; justify-content:center; width:44px; height:44px; border-radius:12px;
  background:#5865F2; color:#fff; box-shadow:0 0 16px rgba(88,101,242,.35), inset 0 1px 0 rgba(255,255,255,.25);
  transition:all .25s ease-in-out; }
.dc-icon:hover{ transform:translateY(-2px); box-shadow:0 0 24px rgba(88,101,242,.55); }
.dc-icon svg{ width:22px; height:22px; }
.x-btn{ width:32px; height:32px; border-radius:9px; background:rgba(255,255,255,.05); border:1px solid rgba(139,92,246,.3); color:#94a3b8; font-size:14px; transition:all .25s ease-in-out; }
.x-btn:hover{ color:#fda4af; border-color:rgba(244,63,94,.5); }

/* ============ TIER BADGES ============ */
.tier{
  display:inline-flex; align-items:center; justify-content:center; text-align:center;
  min-width:44px; height:22px; padding:0 9px; border-radius:8px;
  font-size:10px; font-weight:800; letter-spacing:.08em; text-transform:uppercase;
  border:1px solid rgba(255,255,255,.08);
  backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  transition:transform .25s ease-in-out, box-shadow .25s ease-in-out;
  cursor:default; white-space:nowrap;
}
.tier:hover{ transform:translateY(-2px); }
.tier-HT1{ background:rgba(239,68,68,.15); border-color:#f43f5e; color:#fecdd3;
  box-shadow:inset 0 0 12px rgba(244,63,94,.18), 0 0 16px rgba(244,63,94,.3); }
.tier-HT2{ background:rgba(239,68,68,.15); border-color:rgba(244,63,94,.8); color:#fda4af;
  box-shadow:0 0 10px rgba(244,63,94,.18); }
.tier-HT3{ background:rgba(239,68,68,.10); border-color:rgba(244,63,94,.5); color:#fca5a5; }
.tier-HT4{ background:rgba(239,68,68,.07); border-color:rgba(244,63,94,.35); color:#f87171; }
.tier-HT5{ background:rgba(239,68,68,.05); border-color:rgba(244,63,94,.25); color:#f87171; }
.tier-LT1,.tier-LT2,.tier-LT3,.tier-LT4,.tier-LT5{
  background:rgba(255,255,255,.02); border-color:rgba(255,255,255,.07); color:#64748b; box-shadow:none; }
.tier-none{ background:rgba(255,255,255,.02); border-color:rgba(255,255,255,.06); color:#475569; }
.tier-xl{ min-width:70px; height:32px; padding:0 14px; font-size:14px; border-radius:10px;
  box-shadow:0 0 20px rgba(139,92,246,.3), inset 0 1px 0 rgba(255,255,255,.18); }
.tier-xl.tier-HT1, .tier-xl.tier-HT2{ box-shadow:0 0 22px rgba(244,63,94,.45), inset 0 0 12px rgba(244,63,94,.22); }

/* ============ OVERALL RANK BADGES (#1, #2 …) ============ */
.pos{ min-width:46px; height:46px; padding:0 7px; flex-shrink:0; border-radius:12px; display:grid; place-items:center;
  font-family:'Space Grotesk',sans-serif; font-weight:800; font-size:14px; letter-spacing:.02em;
  transition:transform .25s ease-in-out, box-shadow .25s ease-in-out; }
.pos:hover{ transform:translateY(-2px); }
.pos-1{ background:linear-gradient(160deg,#fde68a,#f59e0b 55%,#b45309); color:#451a03; text-shadow:0 1px 0 rgba(255,255,255,.3);
  box-shadow:inset 0 0 0 1px rgba(253,230,138,.45), inset 0 0 16px rgba(245,158,11,.35), 0 0 18px rgba(245,158,11,.28); }
.pos-2{ background:linear-gradient(160deg,#e2e8f0,#94a3b8 55%,#475569); color:#0f172a; text-shadow:0 1px 0 rgba(255,255,255,.3);
  box-shadow:inset 0 0 0 1px rgba(226,232,240,.4), inset 0 0 16px rgba(148,163,184,.3), 0 0 14px rgba(148,163,184,.22); }
.pos-3{ background:linear-gradient(160deg,#d97706,#b45309 55%,#7c2d12); color:#fff7ed;
  box-shadow:inset 0 0 0 1px rgba(217,119,6,.45), inset 0 0 16px rgba(180,83,9,.32), 0 0 14px rgba(180,83,9,.22); }
.pos-n{ background:rgba(255,255,255,.03); border:1px solid rgba(139,92,246,.2); color:#94a3b8; }
.pos-n:hover{ border-color:rgba(var(--acc),.5); box-shadow:0 0 14px rgba(139,92,246,.25); }
.pos-sm{ min-width:32px; height:20px; padding:0 6px; border-radius:6px; font-size:10px; }
.pos-sm:hover{ transform:none; }

/* ============ REGION CAPSULES ============ */
.cap{ display:inline-flex; align-items:center; justify-content:center; height:20px; padding:0 8px; border-radius:999px;
  font-size:9px; font-weight:800; letter-spacing:.12em; background:rgba(255,255,255,.02); border:1px solid; }
.cap-NA{ color:#34d399; border-color:rgba(16,185,129,.4); }
.cap-EU{ color:#a78bfa; border-color:rgba(139,92,246,.45); }
.cap-AS{ color:#22d3ee; border-color:rgba(6,182,212,.4); }
.cap-AU{ color:#fbbf24; border-color:rgba(245,158,11,.4); }

/* ============ HOTBAR ============ */
.hotbar-wrap{ display:flex; justify-content:center; margin:18px 0; }
.hotbar{ display:flex; flex-wrap:nowrap; align-items:center; gap:6px; padding:9px;
  overflow-x:auto; scrollbar-width:none; -webkit-overflow-scrolling:touch;
  justify-content:center; justify-content:safe center; max-width:100%; }
.hotbar::-webkit-scrollbar{ display:none; }
.mode-slot{
  display:inline-flex; align-items:center; gap:7px; height:42px; padding:0 12px; flex:0 0 auto;
  border-radius:11px; background:linear-gradient(180deg, rgba(20,16,30,.9), rgba(9,8,14,.92));
  border:1px solid rgba(139,92,246,.2);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
  transition:all .25s ease-in-out; text-decoration:none;
}
.mode-slot:hover{ transform:translateY(-2px); border-color:rgba(var(--acc),.5); }
.mode-slot-icon{ display:flex; align-items:center; justify-content:center; width:22px; height:22px; flex:0 0 auto; transition:transform .25s cubic-bezier(.34,1.56,.64,1); }
.mode-slot:hover .mode-slot-icon{ transform:scale(1.2); }
.mode-label{ font-size:12px; font-weight:700; color:#cbd5e1; white-space:nowrap; transition:all .25s ease-in-out; }
.mode-slot.active{
  border-color:rgba(var(--acc),.8);
  background:linear-gradient(180deg, rgba(var(--acc),.12), rgba(9,8,14,.92));
  box-shadow:0 0 0 1px rgba(var(--acc),.4), 0 0 20px rgba(var(--acc),.35), inset 0 0 14px rgba(var(--acc),.1);
}
.mode-slot.active .mode-slot-icon{ transform:scale(1.12); }
.mode-slot.active .mode-label{ color:rgb(var(--acc)); text-shadow:0 0 10px rgba(var(--acc),.6); }
@media (max-width:1140px){
  .hotbar{ gap:5px; padding:8px; }
  .mode-slot{ height:40px; padding:0 9px; gap:5px; }
  .mode-slot-icon{ width:20px; height:20px; }
  .mode-label{ font-size:11px; }
}
@media (max-width:820px){
  .hotbar{ gap:4px; padding:7px; }
  .mode-slot{ height:37px; padding:0 7px; gap:4px; border-radius:9px; }
  .mode-slot-icon{ width:18px; height:18px; }
  .mode-label{ font-size:10.5px; }
}

/* ============ MODE BANNER ============ */
.mode-banner{ display:flex; align-items:center; gap:18px; padding:20px 24px; margin-bottom:6px; }
.mb-title{ margin:0; font-family:'Space Grotesk',sans-serif; font-weight:800; font-size:clamp(22px,4vw,32px); letter-spacing:.02em; color:#f8fafc; }
.mb-sub{ color:#94a3b8; font-size:13px; margin-top:3px; }

/* ============ LEADERBOARD ROWS ============ */
.lb-list{ margin-top:14px; }
.lb-row{ display:flex; align-items:center; gap:14px; padding:14px 16px; margin-bottom:10px; cursor:pointer; position:relative; }
.lb-main{ display:flex; align-items:center; gap:12px; flex:1; min-width:0; }
.lb-id{ min-width:0; }
.lb-name{ font-weight:700; font-size:14px; color:#f1f5f9; display:flex; align-items:center; gap:6px; }
.lb-sub{ font-size:11px; color:#64748b; margin-top:3px; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.lb-strip{ display:flex; gap:7px; flex-wrap:wrap; justify-content:flex-end; }
.strip-cell{ width:46px; display:flex; flex-direction:column; align-items:center; gap:4px; }
.strip-cell .item-box{ width:20px; height:20px; opacity:.95; }
.strip-cell .tier{ width:100%; min-width:0; height:18px; font-size:9px; padding:0 2px; }
.row-admin{ display:flex; gap:4px; }
.adm-btn{ width:30px; height:30px; border-radius:8px; background:rgba(255,255,255,.05); border:1px solid rgba(139,92,246,.25); color:#cbd5e1; font-size:13px; transition:all .2s ease-in-out; }
.adm-btn:hover{ border-color:rgba(var(--acc),.6); color:rgb(var(--acc)); }
.vbadge{ color:rgb(var(--acc)); font-size:11px; text-shadow:0 0 8px rgba(var(--acc),.6); }
.banned-chip{ font-size:9px; font-weight:800; letter-spacing:.1em; color:#fda4af; border:1px solid rgba(244,63,94,.5); border-radius:6px; padding:2px 6px; }

/* ============ TIER COLUMN BOARD ============ */
.tboard{ display:grid; grid-template-columns:repeat(auto-fit,minmax(185px,1fr)); gap:12px; margin-top:14px; }
.tcol{ background:rgba(9,8,14,.7); border:1px solid rgba(139,92,246,.15); border-radius:14px; overflow:hidden; display:flex; flex-direction:column; }
.tcol-head{ padding:10px; text-align:center; border-bottom:1px solid rgba(139,92,246,.15); }
.tcol-title{ font-family:'Space Grotesk',sans-serif; font-weight:800; font-size:13px; letter-spacing:.14em; }
.tcol-count{ font-size:9px; color:#64748b; letter-spacing:.1em; margin-top:2px; }
.tcol-1 .tcol-head{ background:rgba(245,158,11,.06); } .tcol-1 .tcol-title{ color:#f59e0b; }
.tcol-2 .tcol-head{ background:rgba(148,163,184,.06); } .tcol-2 .tcol-title{ color:#94a3b8; }
.tcol-3 .tcol-head{ background:rgba(180,83,9,.06); } .tcol-3 .tcol-title{ color:#b45309; }
.tcol-4 .tcol-head{ background:rgba(100,116,139,.06); } .tcol-4 .tcol-title{ color:#64748b; }
.tcol-5 .tcol-head{ background:rgba(71,85,105,.06); } .tcol-5 .tcol-title{ color:#475569; }
.tcol-body{ padding:8px; display:flex; flex-direction:column; gap:8px; flex:1; }
.pcard{ position:relative; display:flex; align-items:center; gap:8px; padding:8px; background:rgba(255,255,255,.03);
  border:1px solid rgba(139,92,246,.15); border-radius:10px; cursor:pointer; transition:all .25s ease-in-out; }
.pcard:hover{ border-color:rgba(var(--acc),.5); transform:translateY(-1px); box-shadow:0 0 14px rgba(16,185,129,.12); }
.pc-main{ flex:1; min-width:0; }
.pc-name{ font-size:12px; font-weight:700; color:#f1f5f9; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.pc-title{ font-size:9px; color:#64748b; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.pc-side{ display:flex; flex-direction:column; align-items:flex-end; gap:4px; flex-shrink:0; }
.pc-side .tier{ min-width:0; height:18px; font-size:9px; padding:0 6px; }
.mv-row{ position:absolute; top:-9px; left:-6px; display:flex; gap:2px; }
.mv-btn{ width:18px; height:18px; border-radius:5px; font-size:9px; line-height:1; display:grid; place-items:center;
  background:#141020; border:1px solid rgba(139,92,246,.4); color:#cbd5e1; transition:all .2s ease-in-out; }
.mv-btn:hover{ border-color:rgba(var(--acc),.7); color:rgb(var(--acc)); transform:scale(1.15); }

/* ============ AVATARS & ITEMS ============ */
.av{ position:relative; display:inline-block; flex-shrink:0; border-radius:9px; overflow:hidden;
  background:linear-gradient(135deg,#10b981,#8b5cf6); }
.av img{ position:absolute; inset:0; width:100%; height:100%; }
.av-letter{ position:absolute; inset:0; display:grid; place-items:center; color:#04070a; font-weight:800; }
.item-box{ display:inline-flex; align-items:center; justify-content:center; }

/* ============ HOME HERO ============ */
.hero{ text-align:center; padding:52px 20px 44px; margin-top:8px; }
.hero-kicker{ font-size:11px; font-weight:800; letter-spacing:.35em; color:#a78bfa; margin-bottom:14px; }
.hero-sub{ color:#94a3b8; font-size:15px; max-width:520px; margin:14px auto 0; }
.hero-cta{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:26px; }
.hero-stats{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:26px; }
.chip{ display:inline-flex; align-items:center; height:30px; padding:0 14px; border-radius:999px; font-size:11px; font-weight:700;
  color:#cbd5e1; background:rgba(255,255,255,.03); border:1px solid rgba(139,92,246,.25); }
.podium-row{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin:16px 0; }
.podium-card{ padding:18px 14px; display:flex; flex-direction:column; align-items:center; gap:8px; cursor:pointer; text-align:center; }
.podium-card .rk{ width:54px; height:54px; font-size:20px; }
.rk{ width:46px; height:46px; flex-shrink:0; border-radius:12px; display:grid; place-items:center;
  font-family:'Space Grotesk',sans-serif; font-weight:800; font-size:17px; }
.rk-1{ background:linear-gradient(160deg,#fde68a,#f59e0b 55%,#b45309); color:#451a03; text-shadow:0 1px 0 rgba(255,255,255,.3);
  box-shadow:inset 0 0 0 1px rgba(253,230,138,.45), inset 0 0 16px rgba(245,158,11,.35), 0 0 18px rgba(245,158,11,.28); }
.rk-2{ background:linear-gradient(160deg,#e2e8f0,#94a3b8 55%,#475569); color:#0f172a; text-shadow:0 1px 0 rgba(255,255,255,.3);
  box-shadow:inset 0 0 0 1px rgba(226,232,240,.4), inset 0 0 16px rgba(148,163,184,.3), 0 0 14px rgba(148,163,184,.22); }
.rk-3{ background:linear-gradient(160deg,#d97706,#b45309 55%,#7c2d12); color:#fff7ed;
  box-shadow:inset 0 0 0 1px rgba(217,119,6,.45), inset 0 0 16px rgba(180,83,9,.32), 0 0 14px rgba(180,83,9,.22); }
.rk-n{ background:rgba(255,255,255,.03); border:1px solid rgba(139,92,246,.2); color:#64748b; }

/* ============ DISCORD BAR ============ */
.dbar{ display:flex; align-items:center; gap:16px; padding:14px 18px; margin:16px 0; flex-wrap:wrap; }
.dbar-txt{ flex:1; min-width:200px; }
.dbar-title{ font-weight:800; font-size:15px; color:#f1f5f9; }
.dbar-sub{ font-size:12px; color:#64748b; margin-top:2px; }

.admin-add{ display:flex; align-items:center; gap:12px; padding:14px 18px; margin:14px 0; flex-wrap:wrap; }

.admin-add-note{ font-size:11px; color:#64748b; flex:1; min-width:180px; }
.log-row{ font-family:monospace; font-size:11px; color:#94a3b8; padding:5px 0; border-bottom:1px dashed rgba(139,92,246,.12); }
.log-time{ color:#475569; margin-right:8px; }

/* ============ INFO PAGE ============ */
.info-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:14px; margin-top:14px; }
.info-card{ padding:20px; }
.info-card h3{ margin:0 0 10px; font-family:'Space Grotesk',sans-serif; font-size:16px; color:#f1f5f9; }
.info-card p{ margin:0 0 8px; font-size:13px; color:#94a3b8; line-height:1.6; }
.tier-demo-row{ display:flex; align-items:center; gap:10px; margin:8px 0; flex-wrap:wrap; }

/* ============ MODALS & FORMS ============ */
.modal-back{ position:fixed; inset:0; z-index:100; background:rgba(3,3,5,.75); backdrop-filter:blur(6px);
  display:flex; align-items:flex-start; justify-content:center; padding:40px 14px; overflow-y:auto; }
.modal{ width:min(560px,100%); max-height:86vh; overflow-y:auto; padding:20px; animation:fadeUp .25s ease-in-out; }
@keyframes fadeUp{ from{ opacity:0; transform:translateY(14px); } to{ opacity:1; transform:translateY(0); } }
.modal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
.modal-head h3{ margin:0; font-family:'Space Grotesk',sans-serif; font-size:17px; color:#f1f5f9; }
.modal-actions{ display:flex; gap:10px; justify-content:flex-end; margin-top:16px; flex-wrap:wrap; }
.field{ margin-bottom:12px; }
.field label{ display:flex; align-items:center; gap:6px; font-size:11px; font-weight:700; letter-spacing:.06em; color:#94a3b8; margin-bottom:6px; text-transform:uppercase; }
.field input, .field select{ width:100%; height:42px; border-radius:10px; background:rgba(255,255,255,.04);

.field input:focus, .field select:focus{ outline:none; border-color:rgba(var(--acc),.6); box-shadow:0 0 0 3px rgba(var(--acc),.12); }
.form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.tier-grid{ display:grid; grid-template-columns:1fr 1fr; gap:0 12px; }
.check{ display:flex; align-items:center; gap:8px; font-size:13px; color:#cbd5e1; margin:4px 0 12px; cursor:pointer; }
.pf-err{ color:#fda4af; font-size:12px; min-height:16px; margin-top:4px; }
.skin-preview{ display:flex; justify-content:center; margin:4px 0 14px; }
.skin-preview img{ height:150px; image-rendering:pixelated; filter:drop-shadow(0 6px 16px rgba(0,0,0,.6)); }

.prof-top{ display:flex; gap:16px; align-items:center; margin-bottom:16px; }
.prof-skin{ width:86px; height:150px; flex-shrink:0; display:grid; place-items:center; border-radius:12px;

.prof-title{ color:#94a3b8; font-size:13px; margin-top:2px; }
.prof-meta{ display:flex; gap:10px; align-items:center; margin-top:10px; flex-wrap:wrap; }
.prof-tiers{ display:flex; flex-direction:column; gap:6px; }

.legal .up{ color:#cbd5e1; }
.legal code{ font-size:11px; background:rgba(255,255,255,.05); border:1px solid rgba(139,92,246,.2); border-radius:5px; padding:1px 5px; }

.footer{ margin-top:34px; padding:22px 20px 24px; display:flex; flex-direction:column; gap:14px; }
.foot-brand{ display:flex; align-items:center; gap:10px; justify-content:center; }

    PLAY_MODES.forEach(function(m){ if(p.tiers && TIERS.indexOf(p.tiers[m]) >= 0) t[m] = p.tiers[m]; });
    out.push({
      id:String(p.id||("p"+Date.now()+Math.random())).slice(0,40),
      username:u, title:String(p.title||"").slice(0,32),
      region:REGIONS.indexOf(p.region)>=0?p.region:"NA",
      verified:!!p.verified, banned:!!p.banned, tiers:t,
      order:(p.order && typeof p.order==="object") ? p.order : {}
    });
  });
  return out;
}

/* ================= FIREBASE SYNC (the automatic part) ================= */
function initFirebase(){
  try{
    if(!window.firebase){ addLog("Firebase SDK not loaded"); return; }
    firebase.initializeApp(FIREBASE_CONFIG);
    fdb = firebase.database();
    fdb.ref(".info/connected").on("value", function(s){ state.cloudOk = !!s.val(); if(state.view==="admin") render(); });
    firebaseSync();
  }catch(e){
    fdb = null; addLog("Firebase init failed: "+e.message);
  }
}
/* live listener — every visitor updates instantly when the cloud changes */
function firebaseSync(){
  if(!fdb) return;
  fdb.ref("players").on("value", function(snap){
    var val = snap.val();
    if(val === null){
      /* empty cloud: admin's first save will publish everything */
      if(state.isAdmin) cloudPush();
      return;
    }
    var s = sanitize(val);
    if(!s) return;
    if(JSON.stringify(s) === JSON.stringify(state.players)) return; /* no change */
    state.players = s;
    try{ localStorage.setItem(KEY, JSON.stringify({players:state.players})); }catch(e){}
    render();
  }, function(err){ addLog("Cloud read error: "+err.code); });
}
/* push current players to the cloud (admin actions only) */
function cloudPush(){
  if(!fdb) return;
  var clean = sanitize(state.players) || [];
  fdb.ref("players").set(clean).catch(function(e){ addLog("Cloud save failed: "+e.code); });
}

/* ================= RANKING LOGIC ================= */
function strength(t){ var i = TIERS.indexOf(t); return i < 0 ? 0 : 10 - i; }
/* ===== OVERALL = POINTS SYSTEM (like mctiers.com) ===== */
var TIER_POINTS = { HT1:60, LT1:45, HT2:30, LT2:20, HT3:10, LT3:6, HT4:4, LT4:3, HT5:2, LT5:1 };
function pointsFor(p){
  var s = 0;
  PLAY_MODES.forEach(function(m){ s += (TIER_POINTS[p.tiers && p.tiers[m]] || 0); });
  return s;
}
function overallTitle(pts){
  if(pts >= 400) return "Combat Grandmaster";
  if(pts >= 250) return "Combat Master";
  if(pts >= 100) return "Combat Ace";
  if(pts >= 50)  return "Combat Specialist";
  if(pts >= 20)  return "Cadet";
  if(pts >= 10)  return "Novice";
  if(pts >= 1)   return "Rookie";
  return "Unranked";
}
function rankedOverall(){
  return state.players.filter(function(p){ return !p.banned; })
    .map(function(p){ var pts = pointsFor(p); return { p:p, points:pts, title:overallTitle(pts) }; })
    .sort(function(a,b){
      return b.points - a.points || cmpVec(a.p,b.p) || a.p.username.localeCompare(b.p.username);
    });
}

function vec(p){ return PLAY_MODES.map(function(m){ return strength(p.tiers[m]); }).sort(function(a,b){ return b-a; }); }
function cmpVec(a,b){
  var va = vec(a), vb = vec(b);
  for(var i=0;i<va.length;i++){ var d = (vb[i]||0)-(va[i]||0); if(d) return d; }
  return 0;
}
function rankedOverall(){
  return state.players.filter(function(p){ return !p.banned; })
    .map(function(p){ return { p:p, tier:overallTier(p) }; })
    .sort(function(a,b){
      return strength(b.tier)-strength(a.tier) || cmpVec(a.p,b.p) || a.p.username.localeCompare(b.p.username);
    });
}
function rankMap(){
  var m = {};
  rankedOverall().forEach(function(x,i){ m[x.p.id] = i+1; });
  return m;
}
function ordKey(p,mode){ return (p.order && p.order[mode]!=null) ? p.order[mode] : 9999; }
function tierList(mode,tier){
  return state.players.filter(function(p){ return !p.banned && p.tiers[mode]===tier; })
    .sort(function(a,b){ return ordKey(a,mode)-ordKey(b,mode) || a.username.localeCompare(b.username); });
}
function movePlayer(id,where,mode,tier){
  var list = tierList(mode,tier);
  var i = -1; for(var k=0;k<list.length;k++){ if(list[k].id===id){ i=k; break; } }
  if(i<0) return;
  var j = where==="top" ? 0 : where==="bottom" ? list.length-1 :
          where==="-1" ? Math.max(0,i-1) : Math.min(list.length-1,i+1);
  if(i===j) return;
  var arr = list.slice(); var it = arr.splice(i,1)[0]; arr.splice(j,0,it);
  arr.forEach(function(p,idx){ p.order = p.order||{}; p.order[mode]=idx; });
  save();
}

      '<p>PrimeTiers is a fan-made, community leaderboard for competitive Minecraft PvP. <span class="up">Not an official Minecraft service. Not approved by or associated with Mojang or Microsoft.</span></p>' +
      '<h4>2 · Community conduct</h4>' +
      '<ul><li>No harassment, hate speech, witch-hunting or doxxing — towards players or staff.</li>' +
      '<li>No impersonation of staff, testers or other players.</li>' +
      '<li>No spam, advertising or malicious links in the community spaces.</li>' +
      '<li>Do not attempt to manipulate rankings (fake duels, alt accounts, forged evidence).</li></ul>' +
      '<h4>3 · Tiers & rankings</h4>' +
      '<p>Tiers (HT1 → LT5) are assigned by the PrimeTiers staff based on tested duels and reviewed footage. Decisions may be revised at any time. Overall rank is calculated automatically from all gamemode tiers.</p>' +
      '<h4>4 · Enforcement</h4>' +
      '<p>Violations can lead to removal of listings or a permanent ban from the leaderboard and community. Severe cases skip warnings.</p>' +
      '<h4>5 · Changes</h4>' +
      '<p>These terms may be updated; the current version is always available on this page.</p>';
  }else if(kind === "privacy"){
    body =
      '<h4>What we process</h4>' +
      '<p>PrimeTiers has no accounts and collects no personal data (no emails, no passwords, no tracking).</p>' +
      '<h4>Minecraft usernames & skin APIs</h4>' +
      '<ul><li>Player usernames are sent to public skin APIs (<code>crafthead.net</code> and <code>mc-heads.net</code>) solely to display avatar faces and body renders.</li>' +
      '<li>Those requests come from your browser directly to the API; we do not store anything extra about visitors.</li></ul>' +
      '<h4>Leaderboard data</h4>' +
      '<ul><li>The tier list is stored in a realtime cloud database (Google Firebase) and is publicly visible to all visitors of this site.</li>' +
      '<li>It contains only: username, region tag, a short title, gamemode tiers, and ban/verified flags.</li></ul>' +
      '<h4>Local storage (your browser)</h4>' +
      '<ul><li>Your browser stores admin-session and lockout data locally via <code>localStorage</code>. It never leaves your device.</li>' +
      '<li>You can clear it anytime via your browser settings.</li></ul>' +
      '<h4>Removal / opt-out</h4>' +
      '<p>Listed and want out? Contact us on Discord (<a href="'+DISCORD+'" target="_blank" rel="noopener noreferrer" style="color:#5865F2">discord.gg/JkS3d2TWH</a>) with the username and proof of identity, and the listing will be removed promptly.</p>';
  }else{
    body =
      '<h4>Testing standards</h4>' +
      '<ul><li>Test in private duels/arenas with equal, pre-agreed loadouts.</li>' +
      '<li>Best of 3 minimum for a first assessment; document fights (clips) whenever possible.</li>' +
      '<li>No self-tiering — staff never assign their own tier.</li></ul>' +
      '<h4>Placing players</h4>' +
      '<ul><li>Use the ⤒▲▼⤓ arrows to order players inside a tier column by consensus, not favouritism.</li>' +
      '<li>Major tier changes (2+ levels) require a second tester’s opinion.</li></ul>' +
      '<h4>Conduct</h4>' +
      '<ul><li>Stay neutral — no drama, no bias toward friends or region.</li>' +
      '<li>Keep admin credentials private; only staff edit the cloud database.</li>' +
      '<li>Verify changes on the live site after saving — edits are public immediately.</li></ul>';
  }
  openModal(
    '<div class="modal-head"><h3>'+(kind==="terms"?"TERMS OF SERVICE":kind==="privacy"?"PRIVACY POLICY":"STAFF RULES")+'</h3>' +
    '<button type="button" class="x-btn" data-close>✕</button></div>' +
    '<div class="legal">'+body+'</div>' +
    '<div class="modal-actions"><button type="button" class="btn btn-ghost" data-close>Close</button></div>'
  );
}
function openLogin(){
  openModal(
    '<div class="modal-head"><h3>🔒 ADMIN ACCESS</h3><button type="button" class="x-btn" data-close>✕</button></div>' +
    '<form id="login-form" novalidate>' +
      '<div class="field"><label>ACCESS CODE</label><input type="password" name="pass" autocomplete="off" autofocus></div>' +
      '<div class="pf-err" id="lock-msg">'+esc(lockTextNow())+'</div>' +
      '<div class="modal-actions"><button type="button" class="btn btn-ghost" data-close>Cancel</button>' +
      '<button type="submit" class="btn btn-primary">Unlock</button></div>' +
      '<div class="text-[10px] text-slate-500" style="margin-top:8px">'+MAX_ATTEMPTS+' wrong attempts = 24-hour lockout · sessions last 30 min</div>' +
    '</form>'
  );
  var inp = document.querySelector("#login-form input[name=pass]"); if(inp) inp.focus();
}
function lockTextNow(){
  var l = getLock();
  if(l.until > Date.now()){
    var ms = l.until - Date.now();
    var h = Math.floor(ms/3600000), m = Math.floor((ms%3600000)/60000);
    return "Locked — try again in "+h+"h "+m+"m.";
  }
  return "";
}
function openPlayerForm(id){
  var p = id ? findP(id) : null;
  var tierSel = PLAY_MODES.map(function(m,i){
    var cur = p ? (p.tiers[m]||"") : "";
    return '<div class="field" style="margin-bottom:8px"><label>'+esc(m).toUpperCase()+'</label>' +
      '<select name="tier'+i+'"><option value="">Unranked</option>' +
      TIERS.map(function(t){ return '<option value="'+t+'"'+(t===cur?" selected":"")+'>'+t+'</option>'; }).join("") +
      '</select></div>';
  }).join("");
  openModal(
    '<div class="modal-head"><h3>'+(p?"✎ EDIT PLAYER":"＋ ADD PLAYER")+'</h3><button type="button" class="x-btn" data-close>✕</button></div>' +
    '<form id="player-form" novalidate>' +
      '<input type="hidden" name="pf-id" value="'+(p?esc(p.id):"")+'">' +
      '<div class="form-grid">' +
        '<div class="field"><label>USERNAME</label><input name="pf-username" maxlength="16" value="'+(p?esc(p.username):"")+'" autocomplete="off"></div>' +
        '<div class="field"><label>REGION</label><select name="pf-region">' +
          REGIONS.map(function(r){ return '<option value="'+r+'"'+(p&&p.region===r?" selected":"")+'>'+r+'</option>'; }).join("") +
        '</select></div>' +
      '</div>' +
      '<div class="field"><label>TITLE</label><input name="pf-title" maxlength="32" value="'+(p?esc(p.title):"")+'" placeholder="e.g. Sword God"></div>' +
      '<div class="skin-preview" id="skin-preview">' + (p ? skinBody(p.username,150) : '<div class="text-[11px] text-slate-500">type a username to preview skin</div>') + '</div>' +
      '<label class="check"><input type="checkbox" name="pf-verified"'+(p&&p.verified?" checked":"")+'> Verified badge</label>' +
      '<label class="check"><input type="checkbox" name="pf-banned"'+(p&&p.banned?" checked":"")+'> Banned</label>' +
      '<div class="tier-grid">'+tierSel+'</div>' +
      '<div class="pf-err" id="pf-err"></div>' +
      '<div class="modal-actions"><button type="button" class="btn btn-ghost" data-close>Cancel</button>' +
      '<button type="submit" class="btn btn-primary">'+(p?"Save changes":"Add player")+'</button></div>' +
    '</form>'
  );
}
function formErr(msg){ var el=$("#pf-err"); if(el) el.textContent = msg; }
function savePlayerForm(f){
  var id = f.elements["pf-id"].value;
  var username = f.elements["pf-username"].value.replace(/[^A-Za-z0-9_]/g,"").slice(0,16);
  if(username.length < 2){ formErr("Username needs at least 2 letters/numbers."); return; }
  var dup = state.players.find(function(p){ return p.username.toLowerCase()===username.toLowerCase() && p.id!==id; });
  if(dup){ formErr("That username is already on the list."); return; }
  var tiers = {};
  PLAY_MODES.forEach(function(m,i){ var v = f.elements["tier"+i].value; if(TIERS.indexOf(v)>=0) tiers[m]=v; });
  var region = f.elements["pf-region"].value;
  var title = f.elements["pf-title"].value.slice(0,32);
  var verified = f.elements["pf-verified"].checked;
  var banned = f.elements["pf-banned"].checked;
  if(id){
    var p = findP(id); if(!p){ formErr("Player not found."); return; }
    p.username=username; p.region=region; p.title=title; p.verified=verified; p.banned=banned; p.tiers=tiers;
    addLog("Edited player "+username);
  }else{
    state.players.push({ id:"p"+Date.now().toString(36)+Math.floor(Math.random()*1e4),
      username:username, region:region, title:title, verified:verified, banned:banned, tiers:tiers, order:{} });
    addLog("Added player "+username);
  }
  save(); closeModal(); render();
}

/* ================= AUTH / LOCKOUT ================= */
function getLock(){ try{ return JSON.parse(localStorage.getItem(LOCK_KEY)) || {attempts:0,until:0}; }catch(e){ return {attempts:0,until:0}; } }
function setLock(l){ try{ localStorage.setItem(LOCK_KEY, JSON.stringify(l)); }catch(e){} }
function tryLogin(f){
  var code = f.elements["pass"].value;
  var msgEl = $("#lock-msg");
  var l = getLock(), now = Date.now();
  if(l.until > now){ msgEl.textContent = lockTextNow(); return; }
  if(code === ADMIN_CODE){
    setLock({attempts:0,until:0});
    state.isAdmin = true; state.sessionUntil = now + SESSION_MS;
    try{ localStorage.setItem("pt_sess", String(state.sessionUntil)); }catch(e){}
    addLog("Admin session started");
    closeModal(); location.hash = "#/admin"; render();
  }else{
    l.attempts++;
    if(l.attempts >= MAX_ATTEMPTS){
      l.until = now + LOCK_MS; l.attempts = 0;
      addLog("24h lockout: too many failed attempts");
      msgEl.textContent = "Too many attempts — locked for 24 hours.";
    }else{
      msgEl.textContent = "Wrong code — "+(MAX_ATTEMPTS-l.attempts)+" attempts left.";
    }
    setLock(l);
  }
}
function restoreSession(){
  var s = 0; try{ s = parseInt(localStorage.getItem("pt_sess")||"0",10)||0; }catch(e){}
  if(s > Date.now()){ state.isAdmin = true; state.sessionUntil = s; }
  else { try{ localStorage.removeItem("pt_sess"); }catch(e){} }
}
function logout(){
  state.isAdmin = false; state.sessionUntil = 0;
  try{ localStorage.removeItem("pt_sess"); }catch(e){}
  addLog("Admin logged out");
  location.hash = "#/"; render();
}

/* ================= ROUTER & RENDER ================= */
function route(){
  var h = location.hash || "#/";
  if(h === "#/") state.view = "home";
  else if(h === "#/leaderboard"){ state.view = "board"; state.mode = "Overall"; }
  else if(h === "#/info") state.view = "info";
  else if(h === "#/admin") state.view = "admin";
  else if(h.indexOf("#/mode/") === 0){
    state.view = "board";
    var m = decodeURIComponent(h.slice(7));
    if(MODES.indexOf(m) >= 0) state.mode = m;
  }
  else state.view = "home";
  if(state.view === "admin" && !state.isAdmin) state.view = "home";
  render();
}
function render(){
  if(state.isAdmin && Date.now() > state.sessionUntil){
    state.isAdmin = false; try{ localStorage.removeItem("pt_sess"); }catch(e){}
  }
  var ab = $("#admin-btn"); if(ab) ab.textContent = state.isAdmin ? "👑 Panel" : "🔒 Admin";
  var h = location.hash || "#/";
  var navKey = h.indexOf("#/mode/")===0 ? "#/leaderboard" : h;
  document.querySelectorAll(".nav-link").forEach(function(a){
    a.classList.toggle("active", a.getAttribute("data-nav")===navKey);
  });
  var v = state.view==="home" ? viewHome() : state.view==="board" ? viewBoard()
        : state.view==="info" ? viewInfo() : state.view==="admin" ? viewAdmin() : viewHome();
  $("#view").innerHTML = v;
}

/* ================= ERROR BOX ================= */
function showErr(msg){
  var d = document.createElement("div");
  d.className = "err-box";
  d.textContent = "⚠ Something broke:\n" + msg;
  document.body.insertBefore(d, document.body.children[1] || document.body.firstChild);
}
window.addEventListener("error", function(e){ showErr(e.message + "  (line " + (e.lineno||"?") + ")"); });
window.addEventListener("unhandledrejection", function(e){ showErr(String(e.reason && e.reason.message || e.reason)); });

/* ================= EVENTS ================= */
document.addEventListener("click", function(e){
  var t = e.target;
  var lg = t.closest("[data-legal]");
  if(lg){ openLegal(lg.dataset.legal); return; }
  var cj = t.closest("[data-copy-json]");
  if(cj){
    var json = JSON.stringify({players:state.players}, null, 2);
    function done(){ var o=cj.textContent; cj.textContent="✅ Copied!"; setTimeout(function(){ cj.textContent=o; },1600); }
    function fb(){ var ta=document.createElement("textarea"); ta.value=json; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select(); try{ document.execCommand("copy"); done(); }catch(err){} document.body.removeChild(ta); }
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(json).then(done, fb); } else fb();
    return;
  }
  var mv = t.closest(".mv-btn");
  if(mv){ movePlayer(mv.dataset.move, mv.dataset.where, state.mode, mv.dataset.tier); render(); return; }
  var ed = t.closest("[data-edit]");
  if(ed){ openPlayerForm(ed.dataset.edit); return; }
  var bn = t.closest("[data-ban]");
  if(bn){ var p1=findP(bn.dataset.ban); if(p1){ p1.banned=!p1.banned; addLog((p1.banned?"Banned ":"Unbanned ")+p1.username); save(); render(); } return; }
  var dl = t.closest("[data-del]");
  if(dl){ var p2=findP(dl.dataset.del); if(p2 && confirm("Delete "+p2.username+"?")){ state.players=state.players.filter(function(p){return p.id!==p2.id;}); addLog("Deleted "+p2.username); save(); render(); } return; }
  var cp = t.closest("[data-copy]");
  if(cp){
    function done(){ var old=cp.textContent; cp.textContent="✅ Copied!"; setTimeout(function(){ cp.textContent=old; },1400); }
    function fb(){ var i=document.createElement("input"); i.value=DISCORD; document.body.appendChild(i); i.select(); try{ document.execCommand("copy"); done(); }catch(err){} document.body.removeChild(i); }
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(DISCORD).then(done, fb); } else fb();
    return;
  }
  if(t.closest("[data-admin]")){
    if(state.isAdmin){ location.hash = "#/admin"; render(); } else openLogin();
    return;
  }
  if(t.closest("[data-add]")){ openPlayerForm(); return; }
  if(t.closest("[data-clearlog]")){ adminLog = []; render(); return; }
  if(t.closest("[data-logout]")){ logout(); return; }
  if(t.closest("[data-close]")){ closeModal(); return; }
  if(t.classList && t.classList.contains("modal-back")){ closeModal(); return; }
  var card = t.closest("[data-player]");
  if(card){ openPlayerModal(card.dataset.player); return; }
  if(t.closest("#mobile-links a")){ $("#mobile-links").classList.add("hidden"); }
});

document.addEventListener("submit", function(e){
  var f = e.target;
  if(f.id === "login-form"){ e.preventDefault(); tryLogin(f); }
  else if(f.id === "player-form"){ e.preventDefault(); savePlayerForm(f); }
});

document.addEventListener("input", function(e){
  if(e.target.id === "search" || e.target.id === "search-m"){
    state.query = e.target.value.trim().toLowerCase();
    var other = e.target.id === "search" ? $("#search-m") : $("#search");
    if(other && other.value !== e.target.value) other.value = e.target.value;
    render();
  }
  if(e.target.name === "pf-username") updateSkinPreview(e.target.value);
});

function updateSkinPreview(v){
  var box = $("#skin-preview"); if(!box) return;
  var name = String(v||"").replace(/[^A-Za-z0-9_]/g,"");
  if(name.length < 2){ box.innerHTML = '<div class="text-[11px] text-slate-500">type a username to preview skin</div>'; return; }
  box.innerHTML = skinBody(name,150);
}

document.addEventListener("keydown", function(e){ if(e.key === "Escape") closeModal(); });
window.addEventListener("hashchange", route);
$("#mobile-menu").addEventListener("click", function(){ $("#mobile-links").classList.toggle("hidden"); });

/* ================= INIT ================= */
var fy = $("#foot-year"); if(fy) fy.textContent = new Date().getFullYear();
restoreSession();
load();
route();
initFirebase();   /* realtime cloud sync — auto-saves + live updates everywhere */
})();
</script>
</body>
</html>
